# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Environment specific values, override helm_deploy/hnpps-pfs-web-analytics/values.yaml
generic-service:
  replicaCount: 4
  ingress:
    host: hmpps-pfs-web-analytics.hmpps.service.justice.gov.uk

  env:
    OAUTH_ENDPOINT_URL: "http://hmpps-auth.hmpps-auth-prod.svc.cluster.local/auth"
    APPLICATIONINSIGHTS_CONFIGURATION_FILE: applicationinsights.json

generic-prometheus-alerts:
  targetApplication: hmpps-pfs-web-analytics
