# Values here are the same across all environments
generic-service:
  nameOverride: hmpps-pfs-web-analytics
  serviceAccountName: hmpps-pfs-web-analytics
  productId: "DPS147"

  replicaCount: 4

  image:
    repository: ghcr.io/ministryofjustice/hmpps-pfs-web-analytics
    tag: app_version # override at deployment time
    port: 8080

  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/server-snippet: |
        server_tokens off;
        location /queue-admin/retry-all-dlqs {
          deny all;
          return 401;
        }
    tlsSecretName: hmpps-pfs-web-analytics-cert
    path: /
    modsecurity_enabled: true  # enable OWASP core rules then handle false positives by removing or tweaking rules to not block specific args or cookies
    modsecurity_audit_enabled: true
    modsecurity_snippet: |
      SecRuleEngine On
      #  Default is only GET HEAD POST OPTIONS so need to include PUT etc.
      SecAction "id:900200,phase:1,nolog,pass,t:none,setvar:tx.allowed_methods=GET HEAD PATCH POST OPTIONS PUT DELETE,setvar:tx.paranoia_level=3"
      # team here grants access to the OpenSearch logs to delve into the cause of the blockage
      SecDefaultAction "phase:2,pass,log,tag:github_team=hmpps-launchpad-devs,tag:namespace={{ .Release.Namespace }}"
      SecDefaultAction "phase:4,pass,log,tag:github_team=hmpps-launchpad-devs,tag:namespace={{ .Release.Namespace }}"
      # Block Detectify scanner with 418
      SecRule REQUEST_HEADERS:User-Agent "@pm detectify Detectify DETECTIFY" "id:800003,phase:1,deny,status:418,log,tag:github_team=hmpps-launchpad-devs,tag:namespace={{ .Release.Namespace }}"
      # Change default denial to be a 406 so that we can tell easily that it is modsecurity doing the blocking
      SecRuleUpdateActionById 949110 "t:none,deny,status:406,logdata:%{SERVER_NAME}"
      SecRuleUpdateActionById 959100 "t:none,deny,status:406,logdata:%{SERVER_NAME}"

  # Environment variables to load into the deployment
  env:
    SERVER_PORT: "8080"
    SPRING_PROFILES_ACTIVE: "logstash"

  # Pre-existing kubernetes secrets to load as environment variables in the deployment.
  # namespace_secrets:
  #   [name of kubernetes secret]:
  #     [name of environment variable as seen by app]: [key of kubernetes secret to load]

  namespace_secrets:
    hmpps-pfs-web-analytics-application-insights:
      APPLICATIONINSIGHTS_CONNECTION_STRING: "APPLICATIONINSIGHTS_CONNECTION_STRING"
    rds-postgresql-instance-output:
      SPRING_DATASOURCE_USERNAME: "database_username"
      SPRING_DATASOURCE_PASSWORD: "database_password"
      DATABASE_NAME: "database_name"
      DATABASE_ENDPOINT: "rds_instance_endpoint"
    sqs-analytics-queue:
      HMPPS_SQS_QUEUES_ANALYTICS_QUEUE_NAME: "sqs_queue_name"
    sqs-analytics-dlq:
      HMPPS_SQS_QUEUES_ANALYTICS_DLQ_NAME: "sqs_queue_name"

  allowlist:
    groups:
      - internal

generic-prometheus-alerts:
  targetApplication: hmpps-pfs-web-analytics

cron:
  retry_dlqs_schedule: "*/10 * * * *"
