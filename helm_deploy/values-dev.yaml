# Environment specific values, override helm_deploy/hmpps-pfs-web-analytics/values.yaml
generic-service:

  replicaCount: 2

  ingress:
    host: hmpps-pfs-web-analytics-dev.hmpps.service.justice.gov.uk
    className: modsec-non-prod

  scheduledDowntime:
    enabled: true
    startup: '35 6 * * 1-5' # Start at 6:35am UTC Monday-Friday
    shutdown: '35 21 * * 1-5' # Stop at 9:35pm UTC Monday-Friday

  env:
    OAUTH_ENDPOINT_URL: "http://hmpps-auth.hmpps-auth-dev.svc.cluster.local/auth"
    APPLICATIONINSIGHTS_CONFIGURATION_FILE: applicationinsights.dev.json
    SPRINGDOC_API-DOCS_ENABLED: "true"
    SPRINGDOC_SWAGGER-UI_ENABLED: "true"

generic-prometheus-alerts:
  targetApplication: hmpps-pfs-web-analytics

cron:
  retry_dlqs_schedule: "*/10 7-20 * * 1-5"
