server:
  shutdown: immediate

management.endpoint:
  health.cache.time-to-live: 0
  info.cache.time-to-live: 0

oauth:
  endpoint.url: http://localhost:9090/auth

aws:
  provider: localstack

hmpps.sqs:
  provider: localstack
  queues:
    prisonerauditqueue:
      queueName: ${random.uuid}
      asyncQueueClient: true
      dlqName: ${random.uuid}

spring:
  datasource:
    url: 'jdbc:h2:mem:audit-db;MODE=PostgreSQL'
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
  flyway:
    locations: classpath:db/audit,db/audit_{vendor}
    schemas: prisoner
    default-schema: prisoner

hmpps:
  audit:
    queriesStartDate: 2024-01-01

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true