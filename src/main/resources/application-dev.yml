server:
  shutdown: immediate
  port: 8081

oauth:
  endpoint.url: http://localhost:9090/auth

spring:
  datasource:
    url: 'jdbc:h2:mem:audit-db;MODE=PostgreSQL'
  h2:
    console:
      enabled: false
  jpa:
    show-sql: true
  flyway:
    locations: classpath:/db/audit,/db/audit_h2
    schemas: prisoner
    default-schema: prisoner

hmpps:
  audit:
    queriesStartDate: 2024-01-01
  sqs:
    provider: localstack
    queues:
      prisonerauditqueue:
        queueName: prisonerQueue
        asyncQueueClient: true
        dlqName: prisonerDlq

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true